      <rect x="250" y="605" width="1420" height="76" rx="28" fill="#ffffff" stroke="#ea4335" stroke-width="2"/><circle cx="300" cy="643" r="14" fill="#ea4335"/><text x="335" y="655" font-size="34" font-weight="700" fill="#202124" text-anchor="start"><tspan x="335" dy="0">スペックだけのページは価値が下がる。</tspan></text><rect x="250" y="710" width="1420" height="76" rx="28" fill="#ffffff" stroke="#fbbc04" stroke-width="2"/><circle cx="300" cy="748" r="14" fill="#fbbc04"/><text x="335" y="760" font-size="34" font-weight="700" fill="#202124" text-anchor="start"><tspan x="335" dy="0">ブランドの信頼や熱量を伝えるページは価値が上がる。</tspan></text><rect x="250" y="815" width="1420" height="76" rx="28" fill="#ffffff" stroke="#34a853" stroke-width="2"/><circle cx="300" cy="853" r="14" fill="#34a853"/><text x="335" y="865" font-size="34" font-weight="700" fill="#202124" text-anchor="start"><tspan x="335" dy="0">AIに運んでもらい、最後は人に選ばれる状態を作る。</tspan></text>
    
