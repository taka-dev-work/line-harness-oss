name = "line-harness"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true

# ═══════════════════════════════════════════════════════════════
# デフォルト = テスト環境 (noda@)
# 使い方: npx wrangler deploy
# ═══════════════════════════════════════════════════════════════
account_id = "YOUR_DEV_ACCOUNT_ID"

[vars]
OPENAI_MODEL = "gpt-5-mini"
ANTHROPIC_MODEL = "claude-sonnet-5"
GEMINI_MODEL = "gemini-3.6-flash"

[assets]
directory = "dist/client"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "line-harness"
database_id = "YOUR_DEV_D1_DATABASE_ID"
migrations_dir = "../../packages/db/d1-migrations"

# R2 removed — image storage moved to Supabase Storage
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "line-harness-images"

[triggers]
crons = ["*/5 * * * *"]

# ═══════════════════════════════════════════════════════════════
# 本番環境はこのファイルに書かない。
# クライアントごとの client.json から wrangler.client.toml を生成してデプロイする:
#   CLIENT_CONFIG=path/to/client.json pnpm deploy:client
# 詳細: docs/superpowers/specs/2026-11-26-per-client-deployment-design.md
# ═══════════════════════════════════════════════════════════════
